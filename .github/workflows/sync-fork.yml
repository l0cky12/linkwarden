name: Sync fork with upstream

on:
  schedule:
    - cron: '0 6 * * *' # daily 06:00 UTC; NOTE: scheduled workflows are disabled on forks until enabled in the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream/main into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/linkwarden/linkwarden.git
          git fetch upstream main
          git merge upstream/main --no-edit
          git push origin main